name: RaycastedAntiESP
version: ${version}
main: games.cubi.raycastedantiesp.paper.RaycastedAntiESP
api-version: '1.21.4'
prefix: RaycastedAntiESP
authors: [ _Cubicake ]
load: STARTUP
website: https://cubi.games
permissions:
    raycastedantiesp.command:
        description: Permission to use the /RaycastedAntiESP command
        default: op
    raycastedantiesp.bypass:
        description: Deprecated permission. It does not bypass anti-ESP checks and holders are warned when they join.
        default: false
    raycastedantiesp.updatecheck:
        description: Permission to check for plugin updates
        default: op
depend:
    - packetevents
folia-supported: true
